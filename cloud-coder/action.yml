name: Shipyard Cloud Coder
description: Turn one well-defined Shipyard Issue into a tested draft pull request.
author: Shipyard contributors

branding:
  icon: git-pull-request
  color: purple

inputs:
  api-key:
    description: API key for the OpenAI-compatible coding endpoint. Pass a secret, never a literal.
    required: true
  base-url:
    description: Base URL of the OpenAI-compatible API, including its version path.
    required: true
  luna-model:
    description: Model for Agent Brief complexity scores 1–3.
    required: false
    default: gpt-5.6-luna
  terra-model:
    description: Model for Agent Brief complexity scores 4–5.
    required: false
    default: gpt-5.6-terra
  luna-reasoning-effort:
    description: Reasoning effort for Luna coding runs.
    required: false
    default: xhigh
  terra-reasoning-effort:
    description: Reasoning effort for Terra coding runs.
    required: false
    default: xhigh
  github-token:
    description: Token used only by Shipyard's host-side GitHub broker.
    required: false
    default: ${{ github.token }}
  handoff-token:
    description: Shared secret that authenticates Cloud Coder and Cloud Reviewer dispatches.
    required: true
  sandbox-image:
    description: Digest-pinned Docker image containing the repository's test toolchain.
    required: true

outputs:
  dispatched:
    description: 'true when an Issue became a draft pull request; false when it was ignored.'
  pull-request:
    description: The generated draft pull request number, when dispatched.

runs:
  using: node20
  main: src/index.js
