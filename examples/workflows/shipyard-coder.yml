name: Shipyard Cloud Coder

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [shipyard-repair]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shipyard-coder-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  code:
    if: >-
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ready-for-agent' &&
       !github.event.issue.pull_request) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'shipyard-repair')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: dymoo/shipyard/cloud-coder@v3
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}
          base-url: https://api.openai.com/v1
          luna-model: gpt-5.6-luna
          terra-model: gpt-5.6-terra
          luna-reasoning-effort: xhigh
          terra-reasoning-effort: xhigh
          handoff-token: ${{ secrets.SHIPYARD_HANDOFF_TOKEN }}
          sandbox-image: ghcr.io/acme/project-ci@sha256:replace-with-a-real-image-digest
