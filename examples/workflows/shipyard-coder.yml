name: Shipyard Cloud Coder

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [shipyard-repair]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shipyard-coder-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  code:
    if: >-
      vars.LLM_BASE_URL != '' &&
      vars.SHIPYARD_CODER_LOW_COMPLEXITY_MODEL != '' &&
      vars.SHIPYARD_CODER_HIGH_COMPLEXITY_MODEL != '' &&
      ((github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ready-for-agent' &&
       github.event.issue.state == 'open' &&
       !github.event.issue.pull_request) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'shipyard-repair'))
    runs-on: shipyard-runners
    timeout-minutes: 45
    steps:
      - uses: dymoo/shipyard/cloud-coder@v4
        with:
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          low-complexity-model: ${{ vars.SHIPYARD_CODER_LOW_COMPLEXITY_MODEL }}
          high-complexity-model: ${{ vars.SHIPYARD_CODER_HIGH_COMPLEXITY_MODEL }}
          low-complexity-reasoning-effort: ${{ vars.SHIPYARD_CODER_LOW_COMPLEXITY_REASONING_EFFORT }}
          high-complexity-reasoning-effort: ${{ vars.SHIPYARD_CODER_HIGH_COMPLEXITY_REASONING_EFFORT }}
          handoff-token: ${{ secrets.SHIPYARD_HANDOFF_TOKEN }}
          sandbox-image: ghcr.io/acme/project-ci@sha256:replace-with-a-real-image-digest
