name: OpenRouter privacy preflight
description: Prove an OpenRouter key and source-free model route before sending repository content.
author: commitreview contributors

branding:
  icon: shield
  color: purple

inputs:
  api-key:
    description: OpenRouter API key. Pass a secret, never a literal.
    required: true
  required-models:
    description: Newline-separated exact model allowlist the key must expose.
    required: true
  model:
    description: Exact model used for the synthetic tool route.
    required: true
  key-limit-usd:
    description: Exact OpenRouter API-key spending limit in USD.
    required: true
  key-limit-reset:
    description: Required spending-limit reset interval (daily, weekly or monthly).
    required: true
  diagnostic-provider:
    description: Optional provider slug to test with fallbacks disabled.
    required: false
    default: ''

outputs:
  evidence:
    description: Source-free route evidence containing model, provider, tokens and cost.

runs:
  using: node20
  main: index.js
