name: Shipyard Cloud Coder

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [shipyard-repair]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shipyard-coder-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  code:
    if: >-
      vars.LLM_BASE_URL != '' &&
      ((github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'ready-for-agent' &&
        !github.event.issue.pull_request) ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'shipyard-repair'))
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: dymoo/shipyard/cloud-coder@v3
        with:
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          luna-model: openai/gpt-5.6-luna
          terra-model: openai/gpt-5.6-terra
          luna-reasoning-effort: xhigh
          terra-reasoning-effort: xhigh
          handoff-token: ${{ secrets.SHIPYARD_HANDOFF_TOKEN }}
          sandbox-image: node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
