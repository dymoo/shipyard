name: Shipyard Cloud Coder

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [shipyard-repair]

permissions: {}

concurrency:
  group: shipyard-coder-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  code:
    # Trust gate: the label is the approval, so the labeller (event sender)
    # must be the repository owner, whoever wrote the Issue. Issue text stays
    # untrusted model input. repository_dispatch needs a token with
    # contents: write, and the action rejects it without a valid HMAC
    # hand-off proof. Any other event matches no branch and is skipped.
    if: >-
      vars.SHIPYARD_CODER_READY == 'true' &&
      vars.LLM_BASE_URL != '' &&
      vars.SHIPYARD_CODER_LOW_COMPLEXITY_MODEL != '' &&
      vars.SHIPYARD_CODER_HIGH_COMPLEXITY_MODEL != '' &&
      ((github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'ready-for-agent' &&
        github.event.issue.state == 'open' &&
        !github.event.issue.pull_request &&
        github.event.sender.login == github.repository_owner) ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'shipyard-repair'))
    # Public repository: GitHub-hosted minutes are free, each job gets a fresh
    # VM, and the image ships the Docker the sandboxed test run needs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: dymoo/shipyard/cloud-coder@v4
        with:
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          low-complexity-model: ${{ vars.SHIPYARD_CODER_LOW_COMPLEXITY_MODEL }}
          high-complexity-model: ${{ vars.SHIPYARD_CODER_HIGH_COMPLEXITY_MODEL }}
          low-complexity-reasoning-effort: ${{ vars.SHIPYARD_CODER_LOW_COMPLEXITY_REASONING_EFFORT }}
          high-complexity-reasoning-effort: ${{ vars.SHIPYARD_CODER_HIGH_COMPLEXITY_REASONING_EFFORT }}
          handoff-token: ${{ secrets.SHIPYARD_HANDOFF_TOKEN }}
          sandbox-image: node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
